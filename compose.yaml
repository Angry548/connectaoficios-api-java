name: connectaoficios-local

services:
  mysql:
    image: mysql:8.4
    container_name: connectaoficios-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - connectaoficios-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - local

  connectaoficios-java-api:
    image: connectaoficios-java-api:local
    container_name: connectaoficios-java-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      PORT: "8080"
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${MYSQL_USER:?Define MYSQL_USER en .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_ISSUER: ${JWT_ISSUER:?Define JWT_ISSUER en .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS en .env}
      SPRING_PROFILES_ACTIVE: local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - local

  unit-tests:
    image: maven:3.9.16-eclipse-temurin-21
    profiles: [testing]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-testing-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: test
    command: ["sh", "-c", "sh ./mvnw -B clean verify && sh ./mvnw -B site"]
    network_mode: bridge

volumes:
  maven-testing-cache:
  connectaoficios-mysql-data:
    name: connectaoficios-mysql-data

networks:
  local:
    name: connectaoficios-local-network
    driver: bridge
