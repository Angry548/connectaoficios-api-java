<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoreo ConnectaOficios</title><style>
:root{font-family:system-ui,sans-serif;color:#24304b;background:#f3f6fb}body{max-width:1100px;margin:auto;padding:2rem}h1{margin-bottom:.2rem}small{color:#66748c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1.5rem 0}.card,section{background:white;border-radius:12px;padding:1rem;box-shadow:0 2px 12px #1a35500d}.value{font-size:1.5rem;font-weight:700}.ok{color:#12805c}.warn{color:#b57808}.error{color:#c4313a}section{margin:1rem 0;overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:.9rem}th,td{padding:.7rem;border-bottom:1px solid #edf0f5}code{font-size:.78rem}button{padding:.5rem 1rem;border:0;border-radius:6px;background:#244fc2;color:white}
</style></head><body><h1>Monitoreo ConnectaOficios</h1><small>Actividad reciente de esta instancia</small><section><h2>Acceso de administrador</h2><form id="auth"><label for="token">JWT administrativo</label> <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Pega el token sin Bearer"> <button>Consultar</button> <button type="button" id="logout">Cerrar sesi&#243;n</button> <button type="button" id="refresh">Actualizar</button></form><small>El token se conserva solo durante esta sesi&#243;n del navegador.</small><p id="mensaje" role="status" aria-live="polite"></p></section><div class="cards"><div class="card">API<div id="api" class="value">-</div></div><div class="card">Base de datos<div id="db" class="value">-</div></div><div class="card">Peticiones<div id="total" class="value">-</div></div><div class="card">Errores<div id="errores" class="value">-</div></div><div class="card">Tiempo promedio<div id="promedio" class="value">-</div></div></div><small id="ultima"></small><section><h2>Peticiones recientes</h2><table><thead><tr><th>Fecha</th><th>Método</th><th>Endpoint</th><th>Estado</th><th>Duración</th><th>TraceId</th></tr></thead><tbody id="eventos"></tbody></table></section><section><h2>Errores recientes</h2><div id="fallos"></div></section><script>
const texto=(id,v)=>document.getElementById(id).textContent=v;
const clave='connectaoficios.monitoring.token';
const aviso='Se requiere autenticaci\u00f3n de administrador para consultar el monitoreo.';
let versionSesion=0;
function limpiarVista(){for(const id of ['api','db','total','errores','promedio']){texto(id,'-');document.getElementById(id).className='value'}texto('ultima','');document.getElementById('eventos').replaceChildren();document.getElementById('fallos').replaceChildren()}
function cerrarSesion(){versionSesion++;sessionStorage.removeItem(clave);document.getElementById('token').value='';limpiarVista();texto('mensaje',aviso)}
function fila(e){const tr=document.createElement('tr');[new Date(e.fecha).toLocaleString(),e.metodo,e.endpoint,e.estado,e.duracionMs+' ms',e.traceId].forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i===3)td.className=e.estado>=500?'error':e.estado>=400?'warn':'ok';tr.append(td)});return tr}
async function actualizar(){
 const token=sessionStorage.getItem(clave);if(!token){limpiarVista();texto('mensaje',aviso);return}const version=versionSesion;
 try{const r=await fetch('/monitoring/data',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(version!==versionSesion)return;
 if(r.status===401||r.status===403){cerrarSesion();return}if(!r.ok)throw Error();const d=await r.json();if(version!==versionSesion)return;
 texto('mensaje','Sesi\u00f3n de administrador activa.');texto('api','Saludable');texto('db',d.baseDatos==='UP'?'Conectada':'Problemas');document.getElementById('api').className='value ok';document.getElementById('db').className='value '+(d.baseDatos==='UP'?'ok':'error');texto('total',d.actividad.peticiones);texto('errores',d.actividad.errores);texto('promedio',Math.round(d.actividad.promedioMs)+' ms');texto('ultima','\u00daltima actualizaci\u00f3n: '+new Date().toLocaleString());let tbody=document.getElementById('eventos');tbody.replaceChildren(...d.actividad.eventos.map(fila));let fallos=document.getElementById('fallos');fallos.replaceChildren(...d.actividad.eventos.filter(e=>e.estado>=400).slice(0,10).map(e=>{let p=document.createElement('p');p.textContent=new Date(e.fecha).toLocaleString()+' - '+(e.estado>=500?'Error interno':'Solicitud con advertencia')+' ('+e.estado+') - Trace: '+e.traceId;return p}));
 }catch(e){if(version!==versionSesion)return;limpiarVista();texto('mensaje','No se pudo actualizar el monitoreo. Int\u00e9ntalo de nuevo.')}
}
document.getElementById('auth').addEventListener('submit',e=>{e.preventDefault();const campo=document.getElementById('token');const token=campo.value.trim().replace(/^Bearer\s+/i,'');campo.value='';versionSesion++;limpiarVista();if(token)sessionStorage.setItem(clave,token);else sessionStorage.removeItem(clave);actualizar()});
document.getElementById('logout').addEventListener('click',cerrarSesion);document.getElementById('refresh').addEventListener('click',actualizar);actualizar();setInterval(actualizar,15000);
</script></body></html>
