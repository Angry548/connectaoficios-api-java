spring.application.name=ConnectaOficios

spring.datasource.url=jdbc:h2:mem:connectaoficios_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
app.jwt.issuer=connectaoficios-test
app.jwt.audience=connectaoficios-test

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

server.port=0
